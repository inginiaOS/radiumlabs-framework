<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>RadiumLabs Redirect</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: black;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    img {
      max-width: 300px;
      animation: fadeIn 1s ease-in-out infinite alternate;
    }
    p {
      font-family: 'Kanit', sans-serif;
      font-size: 20px;
      color: white;
      margin-top: 20px;
      animation: fadeIn 1s ease-in-out infinite alternate;
    }
    button {
      display: none;
      margin-top: 25px;
      padding: 12px 24px;
      font-family: 'Kanit', sans-serif;
      font-size: 18px;
      background-color: #00c853;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    @keyframes fadeIn {
      from { opacity: 0.5; }
      to { opacity: 1; }
    }
  </style>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>
  <img src="https://img2.pic.in.th/pic/inginiaXradium-copy.md.png" alt="RadiumLabs Logo">
  <p>กรุณารอสักครู่...</p>
  <button id="continueBtn">ดำเนินการต่อ</button>

  <script>
    async function main() {
      try {
        await liff.init({ liffId: "2007908663-bexwv7OQ" });

        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        const profile = await liff.getProfile();
        const userId = profile.userId;

        const googleFormUrl =
          "https://docs.google.com/forms/d/e/1FAIpQLSelQ5N6TtBqmE_ZDVCFx7o0xwm5_WkWNQvzxFz2MFcsY_qcIg/viewform?usp=pp_url&entry.1445787620=" +
          encodeURIComponent(userId);

        const btn = document.getElementById("continueBtn");
        const text = document.querySelector("p");

        // ✅ iPhone redirect อัตโนมัติ
        if (/iPhone|iPad|iPod/i.test(navigator.userAgent)) {
          setTimeout(() => {
            window.location.href = googleFormUrl;
          }, 1500);
        } else {
          // ✅ Android ต้องกดเอง
          text.textContent = "เข้าสู่ระบบสำเร็จ กดปุ่มด้านล่างเพื่อดำเนินการต่อ";
          btn.style.display = "block";
          btn.addEventListener("click", () => {
            window.location.href = googleFormUrl;
          });
        }
      } catch (error) {
        console.error("❌ LIFF init error:", error);
        document.querySelector("p").textContent = "เกิดข้อผิดพลาด กรุณารีเฟรชหน้านี้";
      }
    }

    main();
  </script>
</body>
</html>
