<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>RadiumLabs Redirect</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: black;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    img {
      max-width: 300px;
      animation: fadeIn 1s ease-in-out infinite alternate;
    }
    p {
      font-family: 'Kanit', sans-serif;
      font-size: 20px;
      color: white;
      margin-top: 20px;
    }
    button {
      font-family: 'Kanit', sans-serif;
      background-color: #00FF99;
      border: none;
      color: black;
      padding: 12px 24px;
      font-size: 18px;
      border-radius: 10px;
      margin-top: 25px;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    button:hover { background-color: #00cc7a; }

    @keyframes fadeIn { from { opacity: 0.5; } to { opacity: 1; } }
  </style>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>
  <img src="https://img2.pic.in.th/pic/inginiaXradium-copy.md.png" alt="RadiumLabs Logo">
  <p>กรุณากดปุ่มด้านล่างเพื่อดำเนินการต่อ</p>
  <button id="continueBtn" style="display:none;">เปิดแบบฟอร์ม</button>

  <script>
    const btn = document.getElementById("continueBtn");

    async function initLIFF() {
      try {
        await liff.init({ liffId: "2007908663-bexwv7OQ" });

        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        const profile = await liff.getProfile();
        const userId = profile.userId;

        const googleFormUrl = "https://docs.google.com/forms/d/e/1FAIpQLSelQ5N6TtBqmE_ZDVCFx7o0xwm5_WkWNQvzxFz2MFcsY_qcIg/viewform?usp=pp_url&entry.1445787620=" 
          + encodeURIComponent(userId);

        // แสดงปุ่มแน่นอน
        btn.style.display = "block";
        btn.onclick = () => window.location.href = googleFormUrl;

      } catch (err) {
        console.log("❌ LIFF Error:", err);
        // fallback แสดงปุ่มแม้ liff จะ error
        btn.style.display = "block";
        btn.onclick = () => alert("ไม่สามารถโหลด LIFF ได้ กรุณารีเฟรชหน้านี้อีกครั้ง");
      }
    }

    // ✅ Fallback Timer: ถ้า LIFF โหลดช้าเกิน 2 วินาที → แสดงปุ่มเอง
    setTimeout(() => {
      if (btn.style.display === "none") {
        btn.style.display = "block";
        btn.onclick = () => location.reload();
      }
    }, 2000);

    initLIFF();
  </script>
</body>
</html>
