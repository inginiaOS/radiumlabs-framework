<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>RadiumLabs Redirect</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: black;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    img {
      width: 340px;
      animation: fadeIn 1.5s ease-in-out infinite alternate;
    }
    p {
      font-family: 'Kanit', sans-serif;
      font-size: 22px;
      color: white;
      margin-top: 25px;
      animation: fadeIn 1.5s ease-in-out infinite alternate;
    }
    @keyframes fadeIn {
      from { opacity: 0.5; }
      to { opacity: 1; }
    }
  </style>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>
  <img src="https://img2.pic.in.th/pic/inginiaXradium-copy.md.png" alt="RadiumLabs Logo">
  <p>กรุณารอสักครู่...</p>

  <script>
    async function main() {
      try {
        // ✅ เริ่มต้น LIFF
        await liff.init({ liffId: "2007908663-bexwv7OQ" });

        // ✅ ถ้ายังไม่ล็อกอิน → บังคับล็อกอินก่อน
        if (!liff.isLoggedIn()) {
          liff.login({ redirectUri: window.location.href });
          return;
        }

        // ✅ ดึง userId
        const profile = await liff.getProfile();
        const userId = profile.userId;

        // ✅ ลิงก์ Google Form พร้อม prefill
        const googleFormUrl =
          "https://docs.google.com/forms/d/e/1FAIpQLSelQ5N6TtBqmE_ZDVCFx7o0xwm5_WkWNQvzxFz2MFcsY_qcIg/viewform?usp=pp_url&entry.1445787620=" +
          encodeURIComponent(userId);

        // ✅ หน่วง 1.2 วินาทีให้โลโก้โชว์ก่อน
        setTimeout(() => {
          window.location.href = googleFormUrl;
        }, 1200);
      } catch (err) {
        console.error("เกิดข้อผิดพลาด:", err);
        document.body.innerHTML = `
          <p style="color:white; font-family:'Kanit'; text-align:center;">
            เกิดข้อผิดพลาดในการโหลด<br>กรุณาเปิดลิงก์นี้ผ่าน LINE อีกครั้ง
          </p>`;
      }
    }

    // ✅ รอให้ DOM โหลดเสร็จก่อนค่อยเรียก main()
    document.addEventListener("DOMContentLoaded", main);
  </script>
</body>
</html>
