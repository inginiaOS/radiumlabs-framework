<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>RadiumLabs Redirect</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: black;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    img {
      max-width: 300px;
      animation: fadeIn 1.2s ease-in-out infinite alternate;
    }
    p {
      font-family: 'Kanit', sans-serif;
      font-size: 20px;
      color: white;
      margin-top: 20px;
      animation: fadeIn 1.2s ease-in-out infinite alternate;
    }
    @keyframes fadeIn {
      from { opacity: 0.5; }
      to { opacity: 1; }
    }
  </style>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>
  <img src="https://img2.pic.in.th/pic/inginiaXradium-copy.md.png" alt="RadiumLabs Logo">
  <p>กำลังเชื่อมต่อระบบ...</p>

  <script>
    async function main() {
      try {
        await liff.init({ liffId: "2007908663-bexwv7OQ" });

        // ถ้ายังไม่ล็อกอิน → บังคับล็อกอิน
        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        // ดึงข้อมูลผู้ใช้
        const profile = await liff.getProfile();
        const userId = profile.userId;

        // แนบ userId เข้าไปใน Google Form URL
        const googleFormUrl =
          "https://docs.google.com/forms/d/e/1FAIpQLSelQ5N6TtBqmE_ZDVCFx7o0xwm5_WkWNQvzxFz2MFcsY_qcIg/viewform?usp=pp_url&entry.1445787620=" +
          encodeURIComponent(userId);

        // รอให้โลโก้แสดงสวย ๆ ก่อน แล้วเปิดเบราว์เซอร์นอก
        setTimeout(() => {
          liff.openWindow({
            url: googleFormUrl,
            external: true, // ✅ เปิดใน Chrome/Safari แทนที่จะอยู่ใน LIFF
          });
        }, 1500);
      } catch (err) {
        console.error("เกิดข้อผิดพลาด:", err);
        document.body.innerHTML = "<p style='color:white;'>เกิดข้อผิดพลาดในการเชื่อมต่อ LIFF</p>";
      }
    }

    main();
  </script>
</body>
</html>
