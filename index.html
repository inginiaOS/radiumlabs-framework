<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>RadiumLabs Redirect</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: black;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    img {
      max-width: 300px;
      animation: fadeIn 1s ease-in-out infinite alternate;
    }
    p {
      font-family: 'Kanit', sans-serif;
      font-size: 20px;
      color: white;
      margin-top: 20px;
      animation: fadeIn 1s ease-in-out infinite alternate;
    }
    @keyframes fadeIn {
      from { opacity: 0.5; }
      to { opacity: 1; }
    }
  </style>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>
  <img src="https://img2.pic.in.th/pic/inginiaXradium-copy.md.png" alt="RadiumLabs Logo">
  <p>กำลังเชื่อมต่อระบบ...</p>

  <script>
    async function main() {
      try {
        await liff.init({ liffId: "2007908663-bexwv7OQ" });

        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        const profile = await liff.getProfile();
        const userId = profile.userId;

        const googleFormUrl =
          "https://docs.google.com/forms/d/e/1FAIpQLSelQ5N6TtBqmE_ZDVCFx7o0xwm5_WkWNQvzxFz2MFcsY_qcIg/viewform?usp=pp_url&entry.1445787620=" +
          encodeURIComponent(userId);

        // ✅ ใช้ openWindow เพื่อเปิดเบราว์เซอร์นอก โดยไม่ติด sandbox
        setTimeout(() => {
          liff.openWindow({
            url: googleFormUrl,
            external: true
          });
        }, 1200);
      } catch (err) {
        console.error("เกิดข้อผิดพลาด:", err);
        document.querySelector("p").textContent = "เกิดข้อผิดพลาดในการเชื่อมต่อระบบ...";
      }
    }

    main();
  </script>
</body>
</html>
